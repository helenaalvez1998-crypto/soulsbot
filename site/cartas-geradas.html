<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquivo Pessoal — Cartas do Coliseu</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e26;--line:#343945;--muted:#a6adbb;--gold:#d6b66d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f3f5;font:15px/1.5 system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:28px 18px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(28px,4vw,42px);margin:0 0 4px;color:var(--gold)}
.sub{color:var(--muted);margin-bottom:22px}.filters,.summary,.card,.report{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.filters{padding:14px;display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:9px;margin-bottom:16px}
input,select,button{background:#101218;color:#f2f3f5;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
button{cursor:pointer;background:#51452b;border-color:#8d7540}.summary{display:flex;gap:20px;flex-wrap:wrap;padding:13px 16px;margin-bottom:16px;color:var(--muted)}
.summary strong{color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{padding:15px;min-height:170px}.card h3{margin:0 0 8px;color:var(--gold)}.meta{color:var(--muted);font-size:13px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin:5px 4px 0 0;font-size:12px}
footer{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px}.report{margin-top:26px;padding:18px}.report pre{white-space:pre-wrap;color:var(--muted)}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}}
</style><link rel="stylesheet" href="/elden-ui.css?v=v49">  <link rel="stylesheet" href="/narabot-visual-v59.css?v=59">
</head>
<body><main>
<h1>Arquivo Pessoal</h1><div class="sub">Cartas geradas por transmutação. Cada carta permanece vinculada ao seu criador.</div>
<section class="filters">
<input id="q" placeholder="Buscar nome, lore ou ID">
<select id="faction"><option value="">Todas as facções</option><option>Ordem Áurea</option><option>Véu Carmesim</option><option>Lua Negra</option></select>
<select id="rarity"><option value="">Todas as raridades</option><option>Comum</option><option>Rara</option><option>Épica</option><option>Lendária</option><option>Mítica</option></select>
<select id="affinity"><option value="">Todas as afinidades</option><option>sagrado</option><option>fogo</option><option>sangue</option><option>morte</option><option>lua</option><option>magia</option><option>relampago</option><option>gravidade</option><option>gelo</option><option>veneno</option><option>ancestral</option><option>bestial</option></select>
<select id="role"><option value="">Todas as funções</option><option value="ataque">Ataque</option><option value="defesa">Defesa</option><option value="controle">Controle</option><option value="suporte">Suporte</option></select>
<button id="search">Filtrar</button>
</section>
<section id="summary" class="summary">Carregando coleção…</section>
<section id="cards" class="grid"></section>
<footer><button id="prev">Anterior</button><span id="pagination">Página 1</span><button id="next">Próxima</button></footer>
<section class="report"><h2>Diagnóstico competitivo agregado</h2><div id="balance">Carregando métricas…</div></section>
</main>
<script>
let page=1,pages=1;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const p=new URLSearchParams({page:String(page),page_size:'24',q:$('q').value,faction:$('faction').value,rarity:$('rarity').value,affinity:$('affinity').value,role:$('role').value});
 const r=await fetch('/api/gwent/cartas-geradas?'+p,{credentials:'same-origin'});
 if(!r.ok){$('cards').textContent='Não foi possível carregar a coleção.';return}
 const d=await r.json();pages=d.pages||1;
 const s=d.summary||{};$('summary').innerHTML=`<span>Total: <strong>${s.total||0}</strong></span><span>Artes prontas: <strong>${s.artes_prontas||0}</strong></span><span>Artes pendentes: <strong>${s.artes_pendentes||0}</strong></span><span>Por raridade: <strong>${esc(Object.entries(s.por_raridade||{}).map(x=>x.join(': ')).join(' · ')||'—')}</strong></span>`;
 $('cards').innerHTML=(d.items||[]).map(c=>{let x=c.definition||{};return `<article class="card"><h3>${esc(c.name)}</h3><div class="meta">${esc(c.faction)} · ${esc(c.rarity)} · Poder ${esc(c.power)}</div><p>${esc(x.descricao||'Sem descrição registrada.')}</p><span class="pill">${esc(x.funcao_tatica||'função não definida')}</span>${(x.afinidades||[]).map(a=>`<span class="pill">${esc(a)}</span>`).join('')}<div class="meta" style="margin-top:12px">Arte: ${c.art_ready?'validada/armazenada':'pendente'} · ${esc(c.card_id)}</div><p><a href="/atelie-arte?card_id=${encodeURIComponent(c.card_id)}" style="color:var(--gold)">Abrir Ateliê de Arte →</a></p></article>`}).join('')||'<p>Nenhuma carta encontrada com esses filtros.</p>';
 $('pagination').textContent=`Página ${d.page} de ${d.pages} · ${d.total} cartas`; $('prev').disabled=page<=1;$('next').disabled=page>=pages;
}
async function balance(){
 const r=await fetch('/api/gwent/transmutacao/balanceamento',{credentials:'same-origin'});
 if(!r.ok){$('balance').textContent='Métricas indisponíveis.';return}
 const d=await r.json();
 $('balance').innerHTML=`<div class="summary"><span>Amostra: <strong>${d.total}</strong></span><span>Com habilidade: <strong>${d.percentual_com_habilidade}%</strong></span><span>Sem habilidade: <strong>${d.percentual_sem_habilidade}%</strong></span><span>Desvio da meta: <strong>${d.desvio_meta_50_50_pp} p.p.</strong></span></div><pre>${esc((d.alertas||[]).join('\\n')||'Nenhum alerta estatístico nesta amostra.')}\n\n${esc(d.nota)}</pre>`;
}
$('search').onclick=()=>{page=1;load()};$('prev').onclick=()=>{page=Math.max(1,page-1);load()};$('next').onclick=()=>{page=Math.min(pages,page+1);load()};
load();balance();
</script></body></html>
