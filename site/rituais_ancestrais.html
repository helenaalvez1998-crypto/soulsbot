<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09080d"><title>Rituais Ancestrais — Coliseu</title>
<style>
:root{color-scheme:dark;--bg:#0b0a10;--panel:#19151e;--line:#413544;--gold:#c9aa70;--muted:#b0a5b2;--text:#f0e9df}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2a202b,#0b0a10 58%);color:var(--text);font:15px Inter,system-ui,sans-serif}
main{max-width:1050px;margin:auto;padding:30px 18px 70px}h1{font:700 clamp(27px,5vw,42px) Georgia,serif;color:#e9d5aa;margin:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
a{color:var(--gold)}p{color:var(--muted);line-height:1.6}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:24px}
.recipe{background:linear-gradient(145deg,#211b27,#131118);border:1px solid var(--line);border-radius:13px;padding:18px}.recipe h2{font:700 22px Georgia,serif;color:#e4d0ad;margin:0 0 7px}.lore{font-size:13px;min-height:40px}
.ingredient{border-top:1px solid #352c39;padding:12px 0}.ingredient label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.ingredient select{width:100%;background:#100e15;border:1px solid #514354;border-radius:7px;color:var(--text);padding:10px}
.result{padding:12px;background:#27202b;border-radius:8px;margin-top:10px}.result b{color:#e7cc95}.cost{color:var(--gold);font-weight:700;margin:12px 0}.btn{background:#60472a;border:1px solid #96784d;border-radius:8px;color:#fff0d2;padding:11px 14px;font-weight:700;cursor:pointer;width:100%}.btn:disabled{opacity:.35;cursor:not-allowed}
#status{display:none;padding:12px;border-radius:8px;margin-top:16px;background:#211b23}#status.error{color:#ffb2aa;border:1px solid #78433d}#status.ok{color:#c9e4be;border:1px solid #4c6846}
.note{font-size:12px;color:#a89baa;margin-top:9px}.empty{border:1px dashed var(--line);padding:30px;text-align:center;color:var(--muted);border-radius:10px}
</style><link rel="stylesheet" href="/elden-ui.css?v=v49">  <link rel="stylesheet" href="/narabot-visual-v59.css?v=59">
</head><body><main>
<div class="top"><div><div style="font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px">CARTAS DO COLISEU</div><h1>🜂 RITUAIS ANCESTRAIS</h1></div><span><a href="/forja">Abrir Forja ↗</a> &nbsp;·&nbsp; <a href="/transmutacao">Laboratório ↗</a> &nbsp;·&nbsp; <a href="/linhagens">Receitas de Linhagem ↗</a> &nbsp;·&nbsp; <a href="/">Voltar ao Coliseu ↗</a></span></div>
<p>Ritos raros exigem três exemplares lendários específicos e Fragmentos. O ritual desperta uma unidade Mítica. Exemplares equipados no deck ativo não podem ser sacrificados.</p>
<div id="status" role="status"></div><div id="recipes" class="list"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(msg,type='ok'){let el=$('#status');el.textContent=msg;el.className=type;el.style.display='block'}
let recipes=[];
function render(){if(!recipes.length){$('#recipes').innerHTML='<div class="empty">Nenhuma receita cadastrada.</div>';return}
$('#recipes').innerHTML=recipes.map(r=>`<article class="recipe" data-recipe="${esc(r.id)}"><h2>${esc(r.name)}</h2><div class="lore">${esc(r.lore)}</div>${r.ingredients.map((x,i)=>`<div class="ingredient"><label>Ingrediente ${i+1}: ${esc(x.name)} · ${esc(x.rarity)} — disponíveis: ${x.available}</label><select data-slot="${i}" ${x.available?'':'disabled'}><option value="">${x.available?'Escolha o exemplar':'Ingrediente indisponível'}</option>${x.exemplars.map(e=>`<option value="${e.id}">Exemplar #${e.id} · Poder ${e.power}</option>`).join('')}</select></div>`).join('')}<div class="result">Resultado: <b>${esc(r.result.name)}</b> · ${esc(r.result.rarity)} · Poder inicial mínimo</div><div class="cost">Custo: ${r.fragmentos} Fragmentos</div><button class="btn" data-forge="${esc(r.id)}" ${r.ready?'':'disabled'}>Pré-visualizar e executar receita</button><div class="note">Sacrifício irreversível. O servidor valida propriedade, ingredientes, deck e saldo antes de alterar a coleção.</div></article>`).join('')}
async function load(){try{let res=await fetch('/api/gwent/rituais-ancestrais',{credentials:'same-origin',cache:'no-store'});if(!res.ok)throw Error(res.status===401?'Entre na sua conta para acessar as receitas.':'Falha ao carregar receitas.');recipes=(await res.json()).recipes||[];render()}catch(e){status(e.message,'error')}}
$('#recipes').addEventListener('click',async e=>{let b=e.target.closest('[data-forge]');if(!b)return;let recipe=recipes.find(x=>x.id===b.dataset.forge),card=b.closest('.recipe'),ids=[...card.querySelectorAll('select')].map(x=>Number(x.value));if(ids.some(x=>!x)||new Set(ids).size!==3){status('Selecione três exemplares distintos para esta receita.','error');return}
let summary=recipe.ingredients.map((x,i)=>`${x.name} (#${ids[i]})`).join(' + ');if(!confirm(`Receita: ${recipe.name}\n\nSacrificar: ${summary}\nResultado: ${recipe.result.name} (${recipe.result.rarity})\nCusto: ${recipe.fragmentos} Fragmentos\n\nA operação é irreversível. Confirmar?`))return;
b.disabled=true;try{let res=await fetch('/api/gwent/rituais-ancestrais',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipe_id:recipe.id,exemplar_ids:ids})}),data=await res.json();if(!res.ok||data.status!=='ok'){let msgs={fragmentos_insuficientes:'Fragmentos insuficientes.',exemplar_equipado:'Um ou mais exemplares estão equipados no deck ativo.',receita_incompativel:'Os exemplares não correspondem à receita.',exemplar_nao_encontrado:'Um exemplar não pertence à sua coleção.',deck_indisponivel:'Não foi possível validar o deck ativo.'};throw Error(msgs[data.status]||'A receita foi rejeitada pelo servidor.')}status(`Ritual ancestral concluído. Novo exemplar #${data.exemplar_id}: ${recipe.result.name} · ${data.rarity} · poder ${data.power}. Fragmentos gastos: ${data.fragmentos_gastos}.`);await load()}catch(err){status(err.message,'error');b.disabled=false}});
load();
</script></main></body></html>
