<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cartas do Coliseu — Visual Profissional</title>
  <link rel="stylesheet" href="cartas-visuais.css">
</head>
<body>

<div class="cartas">

  <!-- Card grande -->
  <article class=" carta raro">
    <div class="carta-arte" style="background:#1a2a3a">
      <!-- A imagem seria inserida aqui via <img src="..." -->
    </div>
    <div class="carta-info">
      <div class="carta-nome">Guarda Real</div>
      <div class="carta-custo">3</div>
      <div class="carta-tipo">Unidade • Bronze</div>
    </div>
  </article>

  <!-- Card médio incomum -->
  <article class=" carta incomum">
    <div class="carta-arte" style="background:#1a2a3a"></div>
    <div class="carta-info">
      <div class="carta-nome">Espadachim Pirata</div>
      <div class="carta-custo">2</div>
      <div class="carta-tipo">Unidade • Prata</div>
    </div>
  </article>

  <!-- Card pequeno para deck -->
  <article class=" carta-mini epico">
    <div class="carta-arte" style="background:#1a2a3a"></div>
    <div class="carta-info">
      <div class="carta-nome">Dragão Alado</div>
      <div class="carta-custo">6</div>
    </div>
  </article>

  <!-- Legendário com efeito hover -->
  <article class=" carta legendario">
    <div class="carta-arte" style="background:#1a2a3a"></div>
    <div class="carta-info">
      <div class="carta-nome">Arconte do Vazio</div>
      <div class="carta-custo">9</div>
      <div class="carta-tipo">Lendário • Ouro</div>
    </div>
  </article>

</div>

</body>
</html>
